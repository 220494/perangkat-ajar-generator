<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Perangkat Ajar AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Pengaturan khusus agar rapi saat dicetak ke PDF / Kertas */
        @media print {
            body * { visibility: hidden; }
            #result-section, #result-section * { visibility: visible; }
            #result-section { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; box-shadow: none; border: none; }
            .no-print { display: none !important; }
        }
        
        /* Styling tambahan untuk hasil render Markdown agar menyerupai dokumen resmi */
        .prose h1 { font-size: 1.75rem; font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #1f2937; }
        .prose h2 { font-size: 1.5rem; font-weight: bold; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #374151; }
        .prose h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #4b5563; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.6; }
        .prose ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .prose ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 1rem; }
        .prose li { margin-bottom: 0.25rem; }
        .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
        .prose th, .prose td { border: 1px solid #d1d5db; padding: 0.75rem; text-align: left; }
        .prose th { background-color: #f3f4f6; font-weight: 600; }
        .prose strong { font-weight: 700; color: #111827; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="text-center no-print">
            <h1 class="text-3xl font-bold text-blue-700">Generator Perangkat Ajar</h1>
            <p class="text-gray-600 mt-2">Buat Modul Ajar, RPP, atau LKPD terstruktur secara otomatis dengan AI.</p>
        </div>

        <!-- Form Input -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200 no-print">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mata Pelajaran</label>
                    <input type="text" id="mapel" placeholder="Contoh: Matematika, IPAS, Bahasa Indonesia" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kelas / Fase</label>
                    <input type="text" id="kelas" placeholder="Contoh: Kelas 4, Fase B" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Topik / Materi Pembelajaran</label>
                    <textarea id="topik" rows="2" placeholder="Contoh: Pecahan Senilai, Fotosintesis, atau Teks Deskripsi" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"></textarea>
                </div>
                
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Dokumen</label>
                    <select id="jenis" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white">
                        <option value="Modul Ajar (Kurikulum Merdeka)">Modul Ajar (Kurikulum Merdeka)</option>
                        <option value="RPP (Rencana Pelaksanaan Pembelajaran)">RPP</option>
                        <option value="LKPD (Lembar Kerja Peserta Didik)">LKPD</option>
                        <option value="Silabus">Silabus</option>
                        <option value="Soal Evaluasi / Latihan">Soal Evaluasi / Latihan</option>
                    </select>
                </div>

            </div>

            <button id="generateBtn" onclick="generateDocument()" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition duration-200 flex justify-center items-center gap-2">
                <span>Buat Dokumen Sekarang</span>
            </button>

            <!-- Loading & Error Indicators -->
            <div id="loadingIndicator" class="hidden mt-4 text-center text-blue-600 font-medium animate-pulse">
                Sedang menyusun dokumen... Mohon tunggu sebentar.
            </div>
            <div id="errorMessage" class="hidden mt-4 text-center text-red-600 font-medium p-3 bg-red-50 rounded-lg border border-red-200">
            </div>
        </div>

        <!-- Result Section -->
        <div id="resultSection" class="hidden bg-white p-8 rounded-xl shadow-md border border-gray-200 relative">
            
            <div class="no-print flex justify-end gap-3 mb-6 border-b pb-4">
                <button onclick="copyText()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-lg transition">
                    Salin Teks (Copy)
                </button>
                <button onclick="window.print()" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-lg shadow transition">
                    Cetak / Simpan PDF
                </button>
            </div>

            <!-- Konten Markdown akan dirender di sini -->
            <div id="outputContent" class="prose max-w-none text-gray-800"></div>
            
        </div>

    </div>

    <script>
        // PASTIKAN ANDA MENGGANTI URL DI BAWAH INI DENGAN URL CLOUDFLARE WORKER ANDA
        const WORKER_URL = "https://perangkat-ajar-proxy.dianpamungkas24.workers.dev/";

        const generateBtn = document.getElementById('generateBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorMessage = document.getElementById('errorMessage');
        const resultSection = document.getElementById('resultSection');
        const outputContent = document.getElementById('outputContent');
        let rawGeneratedText = "";

        async function generateDocument() {
            const mapel = document.getElementById('mapel').value.trim();
            const kelas = document.getElementById('kelas').value.trim();
            const topik = document.getElementById('topik').value.trim();
            const jenis = document.getElementById('jenis').value;
            
            if(!mapel || !kelas || !topik) {
                alert("Mohon lengkapi Mata Pelajaran, Kelas, dan Topik/Materi terlebih dahulu!");
                return;
            }

            // Persiapan UI: Tampilkan loading, sembunyikan error & hasil
            loadingIndicator.classList.remove('hidden');
            resultSection.classList.add('hidden');
            errorMessage.classList.add('hidden');
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-75', 'cursor-not-allowed');

            const promptText = `Buatkan ${jenis} untuk mata pelajaran ${mapel} kelas ${kelas} dengan topik/materi: ${topik}. 
            Berikan struktur yang lengkap, profesional, dan menggunakan pedoman kurikulum yang berlaku di Indonesia. Tuliskan dalam format Markdown yang rapi tanpa perlu basa-basi pengantar.`;

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: promptText })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error?.message || data.error || `Gagal menghubungi server (Status: ${response.status})`);
                }

                // Mengekstrak hasil dari JSON Groq
                rawGeneratedText = data.choices[0].message.content;

                // Render Markdown ke HTML menggunakan marked.js
                outputContent.innerHTML = marked.parse(rawGeneratedText);
                resultSection.classList.remove('hidden');

            } catch (error) {
                errorMessage.textContent = "Terjadi Kesalahan: " + error.message;
                errorMessage.classList.remove('hidden');
            } finally {
                loadingIndicator.classList.add('hidden');
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        function copyText() {
            if (!rawGeneratedText) return;
            navigator.clipboard.writeText(rawGeneratedText).then(() => {
                alert("Teks berhasil disalin!");
            }).catch(err => {
                alert("Gagal menyalin teks: " + err);
            });
        }
    </script>
</body>
</html>
